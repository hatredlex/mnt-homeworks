---
- name: Prepare
  hosts: all
  gather_facts: false
  become: false

  tasks:
    - name: Bootstrap python + CA certs (podman-safe)
      ansible.builtin.raw: >
        /bin/sh -c "
        set -e;

        if command -v apt-get >/dev/null 2>&1; then
          apt-get update -y;
          DEBIAN_FRONTEND=noninteractive apt-get install -y python3 python3-six ca-certificates openssl;
          update-ca-certificates || true;
          exit 0;
        fi;

        if command -v dnf >/dev/null 2>&1; then
          dnf install -y python3 python3-six ca-certificates openssl;
          update-ca-trust || true;
          exit 0;
        fi;

        if command -v yum >/dev/null 2>&1; then
          yum install -y python3 python3-six ca-certificates openssl;
          update-ca-trust || true;
          exit 0;
        fi;

        echo 'No supported package manager found' >&2;
        exit 1;
        "
      changed_when: false