---
# Dependency management (download roles/collections)
dependency:
  name: galaxy
  options:
    ignore-certs: false
    ignore-errors: false
    role-file: requirements.yml
    requirements-file: requirements.yml

driver:
  name: docker

ansible:
  cfg:
    defaults:
      host_key_checking: false
#      verbosity: 1
    ssh_connection:
      pipelining: true
  env:
    ANSIBLE_FORCE_COLOR: "1"
    ANSIBLE_LOAD_CALLBACK_PLUGINS: "1"

  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --diff
        - --force-handlers
      ansible_navigator:
        - --mode stdout
        - --pull-policy missing
        - --execution-environment-image ghcr.io/ansible/community-ansible-dev-tools:latest

  playbooks:
    create: create.yml
    converge: converge.yml
    destroy: destroy.yml
    cleanup: cleanup.yml
    prepare: prepare.yml
    side_effect: side_effect.yml
    verify: verify.yml

scenario:
  name: default
  test_sequence:
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

platforms:
  - name: ubuntu
    image: ubuntu:latest
    pre_build_image: true
    command: bash -lc "sleep infinity"

  - name: oraclelinux
    image: oraclelinux:8
    pre_build_image: true
    command: bash -lc "sleep infinity"

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        ansible_connection: community.docker.docker
        ansible_remote_tmp: /tmp/ansible
  env:
    ANSIBLE_ROLES_PATH: "../../../"
#    ANSIBLE_REMOTE_TEMP: "/tmp"
  config_options:
    defaults:
      roles_path: "../../../"
#      remote_tmp: /tmp

verifier:
  name: ansible